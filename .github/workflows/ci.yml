name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build y lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # HU-18: la suite del núcleo de visualización corre sin adaptadores y exige 80 % de cobertura
      # sobre src/core (umbrales en vitest.config.ts). Bloqueante.
      - name: Unit tests (Vitest, core coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Informativo, no bloqueante, mientras sigan los 11 hallazgos preexistentes en los componentes
      # 3D (CanvasOverlay, NodeSphere, GraphScene). Ninguna HU los ha tocado todavía; el día que se
      # salden, este paso pasa a bloquear quitando continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  # El flujo compartido levanta el backend de la rama pareja (mismo nombre) si existe, o main, con
  # este frontend, y corre Cypress en Chromium y Firefox, los dos navegadores que exige la
  # Definición de Terminado.
  e2e:
    name: E2E (backend pareja o main)
    needs: quality
    uses: vista-pdg/dev-workflow/.github/workflows/e2e.yml@main
    with:
      backend-ref: auto
      frontend-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      VISTA_REPO_TOKEN: ${{ secrets.VISTA_REPO_TOKEN }}

  # CD: tras pasar las pruebas, construye la imagen, la sube a Artifact Registry y
  # actualiza Cloud Run. Auth sin llaves (Workload Identity Federation, vars en el repo).
  deploy:
    name: Build y deploy a Cloud Run
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}/frontend
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/setup-gcloud@v3

      # Solo cambia la imagen; env, secretos y recursos los gestiona terraform-iac.
      - name: Deploy
        run: |
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --container frontend \
            --image "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          # /healthz is only for the internal probe: Cloud Run reserves paths ending in "z".
          curl -fsS --retry 5 --retry-all-errors -o /dev/null "$url/"
          curl -fsS --retry 5 --retry-all-errors -o /dev/null "$url/api/courses"
